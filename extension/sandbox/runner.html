<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DeepUpgrade OPFS & Pyodide Core</title>
  <!-- Load Pyodide from CDN in isolated sandbox context -->
  <script src="pyodide/pyodide.js"></script>
</head>
<body>
  <script>
    console.log('[DeepUpgrade Sandbox] Initializing OPFS & Pyodide Runner...');

    let pyodideReadyPromise = null;
    let pyodideInstance = null;

    // 0. NETWORK PROXY CLIENT (Routes fetch/curl via Chrome Extension host context)
    const pendingFetches = new Map();
    let persistentPackages = [];

    window.addEventListener('message', async (ev) => {
      if (ev.data && ev.data.type === 'DU_SET_PERSISTENT_PACKAGES') {
        const { packages } = ev.data;
        if (Array.isArray(packages)) {
          persistentPackages = packages;
          if (pyodideInstance) {
            try {
              for (const pkg of persistentPackages) {
                await pyodideInstance.loadPackage(pkg);
              }
            } catch (e) {}
          }
        }
        return;
      }

      if (ev.data && ev.data.type === 'DU_MOUNT_SKILL') {
        const { path, content } = ev.data;
        if (path && content !== undefined) {
          try {
            await opfs.writeFile(path, content);
          } catch (e) {
            console.warn('[DeepUpgrade Sandbox] Failed to mount skill to VFS:', path, e);
          }
        }
        return;
      }

      if (ev.data && ev.data.type === 'DU_STORE_ATTACHMENT') {
        const { path, data, isBinary, mtime } = ev.data;
        try {
          let content = data;
          if (isBinary && typeof data === 'string') {
            // Decode base64 to Uint8Array
            const binaryString = atob(data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            content = bytes;
          }
          await opfs.writeFile(path, content);
          if (mtime && opfs.files.has(opfs.normalizePath(path))) {
            opfs.files.get(opfs.normalizePath(path)).mtime = mtime;
          }
          console.log(`[DeepUpgrade Sandbox] Stored attachment: ${path}`);
        } catch (e) {
          console.error('[DeepUpgrade Sandbox] Failed to store attachment:', path, e);
        }
        return;
      }

      if (ev.data && ev.data.type === 'DU_REMOVE_ATTACHMENT') {
        const { path } = ev.data;
        try {
          await opfs.remove(path);
          console.log(`[DeepUpgrade Sandbox] Removed attachment: ${path}`);
        } catch (e) {
          console.error('[DeepUpgrade Sandbox] Failed to remove attachment:', path, e);
        }
        return;
      }

      if (ev.data && ev.data.type === 'DU_CLEANUP_ATTACHMENTS') {
        const { maxAgeMs } = ev.data;
        try {
          const now = Date.now();
          for (const [p, item] of [...opfs.files.entries()]) {
            if (p.startsWith('/added/')) {
              if (now - item.mtime > maxAgeMs) {
                await opfs.remove(p);
                console.log(`[DeepUpgrade Sandbox] Auto-cleaned expired file: ${p}`);
              }
            }
          }
        } catch (e) {}
        return;
      }

      if (ev.data && ev.data.type === 'DU_GET_FILE') {
        const { reqId, path } = ev.data;
        try {
          const norm = opfs.normalizePath(path);
          const simpleName = norm.split('/').filter(Boolean).pop() || '';
          
          let item = opfs.files.get(norm);
          if (!item && simpleName) {
            // Check by basename in case it was saved in / or relative
            for (const [p, val] of opfs.files.entries()) {
              if (p.endsWith('/' + simpleName) || p === simpleName || p === '/' + simpleName) {
                item = val;
                break;
              }
            }
          }

          let content = item ? item.content : null;
          let size = item ? item.size : 0;

          if (!content && pyodideInstance && pyodideInstance.FS) {
            try {
              content = pyodideInstance.FS.readFile(norm);
              size = content ? content.byteLength : 0;
            } catch (e) {
              if (simpleName) {
                try {
                  content = pyodideInstance.FS.readFile(simpleName);
                  size = content ? content.byteLength : 0;
                } catch (e2) {}
              }
            }
          }

          if (!content) {
            window.parent.postMessage({ type: 'DU_GET_FILE_RESULT', reqId, success: false, error: 'File not found' }, '*');
            return;
          }

          let base64 = '';
          if (content instanceof Uint8Array || ArrayBuffer.isView(content)) {
            const bytes = new Uint8Array(content.buffer, content.byteOffset, content.byteLength);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) {
              binary += String.fromCharCode(bytes[i]);
            }
            base64 = btoa(binary);
          } else if (typeof content === 'string') {
            // Safe UTF-8 Base64 encoding without deprecated unescape
            base64 = btoa(new TextEncoder().encode(content).reduce((acc, byte) => acc + String.fromCharCode(byte), ''));
          }

          window.parent.postMessage({
            type: 'DU_GET_FILE_RESULT',
            reqId,
            success: true,
            path: norm,
            size: size || (base64.length * 3 / 4),
            base64
          }, '*');
        } catch (err) {
          window.parent.postMessage({ type: 'DU_GET_FILE_RESULT', reqId, success: false, error: err.message }, '*');
        }
        return;
      }

      if (ev.data && ev.data.type === 'DU_PROXY_FETCH_RESULT' && pendingFetches.has(ev.data.fetchId)) {
        const { resolve, reject } = pendingFetches.get(ev.data.fetchId);
        pendingFetches.delete(ev.data.fetchId);
        if (ev.data.success) {
          resolve({
            ok: ev.data.status >= 200 && ev.data.status < 300,
            status: ev.data.status,
            statusText: ev.data.statusText,
            headers: ev.data.headers,
            text: async () => ev.data.data,
            json: async () => JSON.parse(ev.data.data)
          });
        } else {
          reject(new Error(ev.data.error || 'Network request failed'));
        }
      }
    });

    function proxyFetch(url, options = {}) {
      return new Promise((resolve, reject) => {
        const fetchId = Math.random().toString(36).slice(2);
        pendingFetches.set(fetchId, { resolve, reject });
        window.parent.postMessage({
          type: 'DU_PROXY_FETCH',
          fetchId,
          url,
          options
        }, '*');
      });
    }

    // 1. ASYNC INITIALIZATION OF PYODIDE (LOCAL BUNDLED OFFLINE RUNTIME)
    async function initPyodide() {
      if (pyodideInstance) return pyodideInstance;
      if (pyodideReadyPromise) return pyodideReadyPromise;

      pyodideReadyPromise = (async () => {
        console.log('[DeepUpgrade Sandbox] Loading 100% Local Bundled Pyodide WASM runtime...');

        if (typeof loadPyodide === 'undefined') {
          await new Promise((res, rej) => {
            const s = document.createElement('script');
            s.src = "pyodide/pyodide.js";
            s.onload = res;
            s.onerror = () => rej(new Error('Failed to load local pyodide.js'));
            document.head.appendChild(s);
          });
        }

        // Initialize from local offline assets
        pyodideInstance = await loadPyodide({
          indexURL: "pyodide/"
        });

        // Preload micropip & packaging so they are always available out of the box
        try {
          await pyodideInstance.loadPackage(['packaging', 'micropip']);
          console.log('[DeepUpgrade Sandbox] micropip & packaging preloaded successfully!');
        } catch (e) {
          console.warn('[DeepUpgrade Sandbox] Failed to preload micropip:', e);
        }

        // Load any user-saved persistent packages (e.g. pillow, numpy)
        if (persistentPackages && persistentPackages.length > 0) {
          for (const pkg of persistentPackages) {
            try {
              await pyodideInstance.loadPackage(pkg);
              console.log(`[DeepUpgrade Sandbox] Restored persistent package: ${pkg}`);
            } catch (e) {}
          }
        }

        console.log('[DeepUpgrade Sandbox] Local Pyodide WASM & Python 3 loaded 100% offline successfully!');
        // Mount everything that was written before Pyodide finished loading (skills, attachments, files)
        syncVfsToPyodide();
        return pyodideInstance;
      })();

      return pyodideReadyPromise;
    }

    // Start background loading immediately
    pyodideReadyPromise = initPyodide();

    // 2. IN-MEMORY & PYODIDE-BRIDGED VIRTUAL FILE SYSTEM
    // Sandboxed iframes (unique null origin) forbid both OPFS and IndexedDB access in Chromium.
    // An in-memory VFS with bidirectional Pyodide FS mount provides 100% instant reliability and speed.
    class VirtualFileSystem {
      constructor() {
        this.files = new Map();
      }

      normalizePath(pathStr) {
        let p = (pathStr || '').trim().replace(/\\/g, '/');
        if (!p.startsWith('/')) p = '/' + p;
        p = p.replace(/\/+/g, '/');
        if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
        return p;
      }

      async writeFile(pathStr, content) {
        const norm = this.normalizePath(pathStr);
        const size = typeof content === 'string' ? content.length : (content ? content.byteLength || 0 : 0);
        this.files.set(norm, {
          path: norm,
          content: content,
          size: size,
          mtime: Date.now(),
          isDir: false
        });

        // Also synchronize into Pyodide virtual filesystem if Pyodide is active
        try {
          if (isPyodideFsReady() && !isReservedPath(norm)) {
            const parts = norm.split('/').filter(Boolean);
            let dirPath = '';
            for (let i = 0; i < parts.length - 1; i++) {
              dirPath += '/' + parts[i];
              try { pyodideInstance.FS.mkdir(dirPath); } catch (e) {}
            }
            pyodideInstance.FS.writeFile(norm, content);
          }
        } catch (e) {}

        if (typeof content === 'string') queueVfsPersist('write', norm, content);

        return `File '${norm}' written (${size} bytes)`;
      }

      async readFile(pathStr) {
        const norm = this.normalizePath(pathStr);
        if (this.files.has(norm)) {
          const item = this.files.get(norm);
          if (item.isDir) return `cat: ${pathStr}: Is a directory`;
          return item.content;
        }
        // Try Pyodide FS fallback
        try {
          if (pyodideInstance && pyodideInstance.FS) {
            return pyodideInstance.FS.readFile(norm, { encoding: 'utf8' });
          }
        } catch (e) {}
        return `cat: ${pathStr}: No such file or directory`;
      }

      async makeDir(pathStr) {
        const norm = this.normalizePath(pathStr);
        this.files.set(norm, {
          path: norm,
          content: null,
          size: 4096,
          mtime: Date.now(),
          isDir: true
        });

        try {
          if (pyodideInstance && pyodideInstance.FS) {
            const parts = norm.split('/').filter(Boolean);
            let dirPath = '';
            for (const part of parts) {
              dirPath += '/' + part;
              try { pyodideInstance.FS.mkdir(dirPath); } catch (e) {}
            }
          }
        } catch (e) {}

        queueVfsPersist('mkdir', norm, null);

        return `Created directory '${norm}'`;
      }

      async listDir(pathStr = '/') {
        const norm = this.normalizePath(pathStr);
        const prefix = norm === '/' ? '/' : norm + '/';
        const results = [];
        const seen = new Set();

        for (const [p, item] of this.files.entries()) {
          if (p === norm) continue;
          if (p.startsWith(prefix)) {
            const sub = p.slice(prefix.length).split('/')[0];
            if (seen.has(sub)) continue;
            seen.add(sub);

            const isDir = item.isDir || p.slice(prefix.length).includes('/');
            const dateStr = new Date(item.mtime).toISOString().slice(0, 16).replace('T', ' ');
            if (isDir) {
              results.push(`drwxr-xr-x  alex  alex  4096  ${dateStr}  ${sub}/`);
            } else {
              results.push(`-rw-r--r--  alex  alex  ${item.size.toString().padStart(5, ' ')}  ${dateStr}  ${sub}`);
            }
          }
        }

        // Merge files/directories created directly by Python inside the Pyodide FS.
        if (isPyodideFsReady()) {
          try {
            const entries = pyodideInstance.FS.readdir(norm);
            for (const name of entries) {
              if (name === '.' || name === '..' || name === '__pycache__') continue;
              if (seen.has(name)) continue;
              const full = norm === '/' ? '/' + name : norm + '/' + name;
              if (isReservedPath(full)) continue;
              // At the root, hide Pyodide's own system directories.
              if (norm === '/' && !['home', 'tmp', 'skills', 'added'].includes(name)) continue;
              let st;
              try { st = pyodideInstance.FS.stat(full); } catch (e) { continue; }
              const isDir = pyodideInstance.FS.isDir(st.mode);
              const mtime = st.mtime ? st.mtime.getTime() : Date.now();
              const dateStr = new Date(mtime).toISOString().slice(0, 16).replace('T', ' ');
              if (isDir) {
                results.push(`drwxr-xr-x  alex  alex  4096  ${dateStr}  ${name}/`);
              } else {
                results.push(`-rw-r--r--  alex  alex  ${String(st.size).padStart(5, ' ')}  ${dateStr}  ${name}`);
              }
              seen.add(name);
            }
          } catch (e) { /* Pyodide FS has no such directory */ }
        }

        return results.length > 0 ? results.join('\n') : '(empty directory)';
      }

      async remove(pathStr) {
        const norm = this.normalizePath(pathStr);
        let count = 0;
        for (const p of [...this.files.keys()]) {
          if (p === norm || p.startsWith(norm + '/')) {
            this.files.delete(p);
            try {
              if (pyodideInstance && pyodideInstance.FS) {
                pyodideInstance.FS.unlink(p);
              }
            } catch(e) {}
            count++;
          }
        }
        if (count > 0) queueVfsPersist('remove', norm, null);
        return `Removed ${count} item(s)`;
      }
    }

    const opfs = new VirtualFileSystem();

    // 1.1 DURABLE VFS (owned by the host page)
    // This iframe is a manifest sandbox page: it runs in a unique origin, so
    // OPFS/IndexedDB are unavailable here. The host page (content script) keeps
    // one durable store and receives every mutation; the Map above stays the
    // fast working copy so all tools keep working synchronously.
    const VFS_PERSIST = {
      booted: false,
      bootPromise: null,
      bootResolve: null,
      pending: new Map(),
      seq: 0,
      queue: Promise.resolve(),
      mode: 'memory'
    };

    function vfsCanPersist() {
      return !!(window.parent && window.parent !== window);
    }

    function vfsPersistRequest(op, path, content) {
      if (!vfsCanPersist()) return Promise.resolve();
      const reqId = 'vfs_' + (++VFS_PERSIST.seq);
      return new Promise((resolve) => {
        const timer = setTimeout(() => {
          VFS_PERSIST.pending.delete(reqId);
          resolve({ ok: false, timeout: true });
        }, 5000);
        VFS_PERSIST.pending.set(reqId, (msg) => {
          clearTimeout(timer);
          resolve(msg);
        });
        try {
          window.parent.postMessage({ type: 'DU_VFS_MUTATE', reqId, op, path, content }, '*');
        } catch (e) {
          clearTimeout(timer);
          VFS_PERSIST.pending.delete(reqId);
          resolve({ ok: false });
        }
      });
    }

    function queueVfsPersist(op, path, content) {
      const run = VFS_PERSIST.queue.then(
        () => vfsPersistRequest(op, path, content),
        () => vfsPersistRequest(op, path, content)
      );
      VFS_PERSIST.queue = run.catch(() => {});
      return run;
    }

    function flushVfsPersistence() {
      return VFS_PERSIST.queue.catch(() => {});
    }

    function waitForVfsBoot(timeoutMs = 4000) {
      if (VFS_PERSIST.booted) return Promise.resolve();
      if (!VFS_PERSIST.bootPromise) {
        VFS_PERSIST.bootPromise = new Promise((resolve) => {
          VFS_PERSIST.bootResolve = resolve;
          setTimeout(resolve, timeoutMs);
        });
      }
      return VFS_PERSIST.bootPromise;
    }

    function requestVfsBoot() {
      if (!vfsCanPersist()) return;
      window.parent.postMessage({ type: 'DU_VFS_BOOT' }, '*');
    }

    window.addEventListener('message', (ev) => {
      const data = ev.data;
      if (!data || !data.type) return;

      if (data.type === 'DU_VFS_MUTATED') {
        const resolve = VFS_PERSIST.pending.get(data.reqId);
        if (resolve) {
          VFS_PERSIST.pending.delete(data.reqId);
          resolve(data);
        }
        return;
      }

      if (data.type === 'DU_VFS_SNAPSHOT' && !VFS_PERSIST.booted) {
        VFS_PERSIST.mode = data.mode || 'memory';
        const files = Array.isArray(data.files) ? data.files : [];
        for (const f of files) {
          if (!f || !f.path || typeof f.content !== 'string') continue;
          const norm = opfs.normalizePath(f.path);
          if (isReservedPath(norm)) continue;
          opfs.files.set(norm, {
            path: norm,
            content: f.content,
            size: f.content.length,
            mtime: f.mtime || Date.now(),
            isDir: false
          });
        }
        try { syncVfsToPyodide(); } catch (e) {}
        VFS_PERSIST.booted = true;
        if (VFS_PERSIST.bootResolve) VFS_PERSIST.bootResolve();
        console.log(`[DeepUpgrade VFS] hydrated ${files.length} file(s), mode=${VFS_PERSIST.mode}`);
      }
    });


    // 2.1 VFS ↔ PYODIDE FS BRIDGE
    // The in-memory Map is the canonical VFS (works even before Pyodide is loaded).
    // These helpers keep the Pyodide filesystem in sync so `write` → `python open()`
    // and `python open(..., 'w')` → `ls`/`grep`/`find` actually see each other.
    const PYODIDE_SYNC_ROOTS = ['/home/pyodide', '/tmp', '/skills', '/added'];
    const PYODIDE_RESERVED = ['/lib', '/dev', '/proc', '/bin', '/usr', '/etc', '/opt', '/var', '/sbin', '/home/pyodide/.cache'];

    function isPyodideFsReady() {
      return !!(pyodideInstance && pyodideInstance.FS);
    }

    function isReservedPath(path) {
      return PYODIDE_RESERVED.some(r => path === r || path.startsWith(r + '/'));
    }

    function ensurePyodideDir(dirPath) {
      if (!isPyodideFsReady() || !dirPath || dirPath === '/') return;
      const parts = dirPath.split('/').filter(Boolean);
      let cur = '';
      for (const part of parts) {
        cur += '/' + part;
        try { pyodideInstance.FS.mkdir(cur); } catch (e) { /* already exists */ }
      }
    }

    /** Copy the canonical in-memory VFS into the Pyodide FS. */
    function syncVfsToPyodide() {
      if (!isPyodideFsReady()) return;
      for (const [p, item] of opfs.files.entries()) {
        if (item.isDir || item.content === null || item.content === undefined) continue;
        if (isReservedPath(p)) continue;
        try {
          const parent = p.split('/').slice(0, -1).join('/') || '/';
          ensurePyodideDir(parent);
          pyodideInstance.FS.writeFile(p, item.content);
        } catch (e) {
          console.warn('[DeepUpgrade Sandbox] VFS→Pyodide sync failed for', p, e);
        }
      }
    }

    function collectPyodideFiles(root = '/') {
      const out = [];
      if (!isPyodideFsReady()) return out;
      const walk = (dir) => {
        let entries;
        try { entries = pyodideInstance.FS.readdir(dir); } catch (e) { return; }
        for (const name of entries) {
          if (name === '.' || name === '..' || name === '__pycache__') continue;
          const full = (dir === '/' ? '' : dir) + '/' + name;
          if (isReservedPath(full)) continue;
          let st;
          try { st = pyodideInstance.FS.stat(full); } catch (e) { continue; }
          if (pyodideInstance.FS.isDir(st.mode)) {
            walk(full);
          } else {
            out.push({
              path: full,
              size: st.size,
              mtime: st.mtime ? st.mtime.getTime() : Date.now()
            });
          }
        }
      };
      const norm = opfs.normalizePath(root);
      if (norm === '/') {
        for (const r of PYODIDE_SYNC_ROOTS) walk(r);
      } else {
        walk(norm);
      }
      return out;
    }

    function readPyodideText(path) {
      if (!isPyodideFsReady()) return null;
      try {
        const bytes = pyodideInstance.FS.readFile(path);
        return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
      } catch (e) {
        return null;
      }
    }

    /** Import text files created by Python back into the canonical VFS. */
    function syncPyodideToVfs() {
      for (const f of collectPyodideFiles('/')) {
        const text = readPyodideText(f.path);
        if (text === null) continue;
        const existing = opfs.files.get(f.path);
        if (existing && existing.content === text) continue;
        opfs.files.set(f.path, {
          path: f.path,
          content: text,
          size: text.length,
          mtime: f.mtime,
          isDir: false
        });
      }
    }

    // 3. BIGINT MATH EVALUATOR
    function safeBigIntEval(expr) {
      try {
        let clean = expr.trim().replace(/\^/g, '**');
        clean = clean.replace(/\b(\d+)\b(?!\.)/g, '$1n');
        return String(eval(clean)).replace(/n$/, '');
      } catch (e) {
        try {
          return String(eval(expr.replace(/\^/g, '**')));
        } catch (err) {
          return 'calc error: ' + err.message;
        }
      }
    }

    // 4. POSIX-COMPATIBLE SHELL OVER THE VFS
    //
    // The old implementation cut the command line with split(';') / split('>')
    // and dispatched each fragment to a hand-rolled switch. That broke on
    // quoted '>' , on '>>' (it was echoed literally), on $? and $VAR, and it
    // made the model believe bash, python and write used different filesystems.
    // This is a real (small) POSIX shell: lexer -> parser -> executor over the
    // one shared VFS.

    const SHELL_OPS = ['&&', '||', '2>>', '2>&1', '2>', '&>', '>>', '<<-', '<<', '>', '<', '|', ';', '&'];

    function shellState() {
      if (!window.__DU_SHELL_STATE) {
        window.__DU_SHELL_STATE = {
          cwd: '/',
          status: 0,
          exit: null,
          pid: 4242,
          env: {
            HOME: '/home/alex',
            USER: 'alex',
            LOGNAME: 'alex',
            SHELL: '/bin/bash',
            PATH: '/usr/local/bin:/usr/bin:/bin',
            TERM: 'xterm-256color',
            LANG: 'C.UTF-8',
            PWD: '/',
            OLDPWD: '/'
          }
        };
      }
      return window.__DU_SHELL_STATE;
    }

    function shellResetExit() {
      const st = shellState();
      st.exit = null;
      st.status = 0;
    }

    function shellResolvePath(cwd, p) {
      let s = String(p === undefined || p === null ? '' : p);
      const st = shellState();
      if (!s) s = cwd;
      if (s === '~') s = st.env.HOME || '/';
      else if (s.startsWith('~/')) s = (st.env.HOME || '/') + s.slice(1);
      const abs = s.startsWith('/') ? s : (cwd === '/' ? '' : cwd) + '/' + s;
      const parts = [];
      for (const part of abs.split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') parts.pop();
        else parts.push(part);
      }
      return '/' + parts.join('/');
    }

    function vfsStatNorm(norm) {
      const item = opfs.files.get(norm);
      if (item) {
        return { isDir: !!item.isDir, size: item.size || 0, mtime: item.mtime || Date.now() };
      }
      if (isPyodideFsReady()) {
        try {
          const st = pyodideInstance.FS.stat(norm);
          if (st) {
            return {
              isDir: pyodideInstance.FS.isDir(st.mode),
              size: st.size || 0,
              mtime: st.mtime ? (st.mtime.getTime ? st.mtime.getTime() : Number(st.mtime) * 1000) : Date.now()
            };
          }
        } catch (e) { /* not in the Pyodide FS */ }
      }
      // Directories are implicit: a file at /a/b/c means /a/b exists.
      if (norm !== '/') {
        const prefix = norm + '/';
        for (const p of opfs.files.keys()) {
          if (p.startsWith(prefix)) return { isDir: true, size: 0, mtime: Date.now() };
        }
      }
      return null;
    }

    function vfsListNorm(norm) {
      const out = new Map();
      const prefix = norm === '/' ? '/' : norm + '/';
      for (const [p, item] of opfs.files.entries()) {
        if (p === norm || !p.startsWith(prefix)) continue;
        const rest = p.slice(prefix.length);
        const name = rest.split('/')[0];
        const isDir = rest.includes('/') || !!item.isDir;
        const prev = out.get(name);
        if (!prev || (prev.isDir && !isDir)) {
          out.set(name, {
            name,
            isDir,
            size: isDir ? 0 : (item.size || 0),
            mtime: item.mtime || Date.now()
          });
        }
      }
      if (isPyodideFsReady()) {
        try {
          for (const name of pyodideInstance.FS.readdir(norm)) {
            if (name === '.' || name === '..' || name === '__pycache__') continue;
            if (out.has(name)) continue;
            const full = norm === '/' ? '/' + name : norm + '/' + name;
            if (isReservedPath(full)) continue;
            if (norm === '/' && !['home', 'tmp', 'skills', 'added'].includes(name)) continue;
            let st;
            try { st = pyodideInstance.FS.stat(full); } catch (e) { continue; }
            out.set(name, {
              name,
              isDir: pyodideInstance.FS.isDir(st.mode),
              size: st.size || 0,
              mtime: st.mtime ? (st.mtime.getTime ? st.mtime.getTime() : Date.now()) : Date.now()
            });
          }
        } catch (e) { /* no such directory in the Pyodide FS */ }
      }
      return [...out.values()].sort((a, b) => a.name.localeCompare(b.name));
    }

    function vfsReadTextNorm(norm) {
      const item = opfs.files.get(norm);
      if (item) {
        if (item.isDir) return { error: 'Is a directory' };
        if (item.content === null || item.content === undefined) return { text: '' };
        if (typeof item.content === 'string') return { text: item.content };
        try {
          return { text: new TextDecoder('utf-8', { fatal: true }).decode(item.content) };
        } catch (e) {
          return { error: 'Is a binary file' };
        }
      }
      if (isPyodideFsReady()) {
        try {
          const st = pyodideInstance.FS.stat(norm);
          if (pyodideInstance.FS.isDir(st.mode)) return { error: 'Is a directory' };
          const text = readPyodideText(norm);
          if (text !== null) return { text };
        } catch (e) { /* not in the Pyodide FS */ }
      }
      return { missing: true };
    }

    async function vfsWriteTextNorm(norm, text) {
      if (norm === '/dev/null') return;
      const parent = norm.split('/').slice(0, -1).join('/') || '/';
      if (parent !== '/') {
        const st = vfsStatNorm(parent);
        if (!st || !st.isDir) {
          const parts = parent.split('/').filter(Boolean);
          let acc = '';
          for (const part of parts) {
            acc += '/' + part;
            if (!vfsStatNorm(acc)) await opfs.makeDir(acc);
          }
        }
      }
      await opfs.writeFile(norm, text);
    }

    async function vfsRemoveNorm(norm, recursive) {
      if (norm === '/') return { error: 'Refusing to remove /' };
      const st = vfsStatNorm(norm);
      if (!st) return { error: 'No such file or directory' };
      if (st.isDir && !recursive) {
        if (vfsListNorm(norm).length > 0) return { error: 'Directory not empty' };
      }
      for (const p of [...opfs.files.keys()]) {
        if (p === norm || p.startsWith(norm + '/')) opfs.files.delete(p);
      }
      if (isPyodideFsReady()) {
        try {
          if (st.isDir) pyodideInstance.FS.rmdir(norm);
          else pyodideInstance.FS.unlink(norm);
        } catch (e) { /* already gone */ }
      }
      queueVfsPersist('remove', norm, null);
      return { ok: true };
    }

    function globToRegExp(pattern) {
      let out = '^';
      for (let i = 0; i < pattern.length; i++) {
        const ch = pattern[i];
        if (ch === '*') out += '[^/]*';
        else if (ch === '?') out += '[^/]';
        else if (ch === '[') {
          const end = pattern.indexOf(']', i + 1);
          if (end === -1) out += '\\[';
          else {
            let cls = pattern.slice(i + 1, end);
            if (cls.startsWith('!')) cls = '^' + cls.slice(1);
            out += '[' + cls.replace(/\\/g, '\\\\') + ']';
            i = end;
          }
        } else out += ch.replace(/[.+^${}()|\\]/g, '\\$&');
      }
      return new RegExp(out + '$');
    }

    function shellGlob(pattern, cwd) {
      if (!/[*?\[]/.test(pattern)) return [pattern];
      const absolute = shellResolvePath(cwd, pattern);
      const segments = absolute.split('/').filter(Boolean);
      let bases = ['/'];
      for (const seg of segments) {
        const next = [];
        for (const base of bases) {
          if (!/[*?\[]/.test(seg)) {
            next.push(base === '/' ? '/' + seg : base + '/' + seg);
            continue;
          }
          const re = globToRegExp(seg);
          for (const entry of vfsListNorm(base)) {
            if (re.test(entry.name)) next.push(base === '/' ? '/' + entry.name : base + '/' + entry.name);
          }
        }
        bases = next;
      }
      const matches = bases.filter((p) => vfsStatNorm(p));
      if (matches.length === 0) return [pattern];
      if (pattern.startsWith('/')) return matches;
      const baseDir = cwd === '/' ? '' : cwd;
      return matches.map((p) => {
        if (baseDir && p.startsWith(baseDir + '/')) return p.slice(baseDir.length + 1);
        if (p === baseDir) return '.';
        return p;
      });
    }

    // --- lexer ---

    function shellReadBalanced(src, startIdx) {
      // src[startIdx] === '('
      let depth = 0;
      let quote = null;
      for (let i = startIdx; i < src.length; i++) {
        const ch = src[i];
        if (quote) {
          if (ch === '\\' && quote === '"') { i++; continue; }
          if (ch === quote) quote = null;
          continue;
        }
        if (ch === '\\') { i++; continue; }
        if (ch === "'" || ch === '"') { quote = ch; continue; }
        if (ch === '(') depth++;
        else if (ch === ')') {
          depth--;
          if (depth === 0) return { text: src.slice(startIdx + 1, i), end: i };
        }
      }
      return { text: src.slice(startIdx + 1), end: src.length - 1 };
    }

    function shellLex(src) {
      const tokens = [];
      let cur = null;
      let pending = null;
      let i = 0;
      const n = src.length;

      const flush = () => {
        if (cur && cur.parts.length > 0) {
          const token = {
            type: 'word',
            parts: cur.parts,
            raw: cur.parts.map((p) => p.text).join('')
          };
          tokens.push(token);
          if (pending && pending.delimiter === null) {
            pending.delimiter = token.raw;
            token.heredocDelim = true;
          }
        }
        cur = null;
      };
      const add = (kind, text) => {
        if (!cur) cur = { parts: [] };
        const last = cur.parts[cur.parts.length - 1];
        if (last && last.kind === kind) last.text += text;
        else cur.parts.push({ kind, text });
      };

      while (i < n) {
        const ch = src[i];

        if (ch === '\\') {
          const next = src[i + 1];
          if (next === '\n') { i += 2; continue; }
          if (next === undefined) { add('bare', '\\'); i++; continue; }
          add('bare', next);
          i += 2;
          continue;
        }

        if (ch === "'") {
          let j = i + 1;
          let buf = '';
          while (j < n && src[j] !== "'") buf += src[j++];
          add('single', buf);
          i = Math.min(j + 1, n);
          continue;
        }

        if (ch === '"') {
          let j = i + 1;
          let buf = '';
          while (j < n && src[j] !== '"') {
            if (src[j] === '\\' && j + 1 < n && '"\\$`'.includes(src[j + 1])) {
              buf += src[j + 1];
              j += 2;
              continue;
            }
            buf += src[j++];
          }
          add('double', buf);
          i = Math.min(j + 1, n);
          continue;
        }

        if (ch === '$' && src[i + 1] === '(') {
          const inner = shellReadBalanced(src, i + 1);
          add('bare', src.slice(i, inner.end + 1));
          i = inner.end + 1;
          continue;
        }

        if (ch === ' ' || ch === '\t' || ch === '\r') { flush(); i++; continue; }
        if (ch === '\n') {
          flush();
          if (pending && pending.delimiter !== null) {
            const body = [];
            let j = i + 1;
            while (j <= n) {
              const lineEnd = src.indexOf('\n', j);
              const line = lineEnd === -1 ? src.slice(j) : src.slice(j, lineEnd);
              const cmp = pending.stripTabs ? line.replace(/^\t+/, '') : line;
              if (cmp === pending.delimiter) {
                i = lineEnd === -1 ? n : lineEnd + 1;
                break;
              }
              body.push(line);
              if (lineEnd === -1) { i = n; break; }
              j = lineEnd + 1;
            }
            pending.token.heredoc = body.join('\n') + (body.length ? '\n' : '');
            pending = null;
            tokens.push({ type: 'op', value: ';' });
            continue;
          }
          tokens.push({ type: 'op', value: ';' });
          i++;
          continue;
        }

        let op = null;
        for (const candidate of SHELL_OPS) {
          if (src.startsWith(candidate, i)) { op = candidate; break; }
        }
        if (op) {
          flush();
          const token = { type: 'op', value: op };
          tokens.push(token);
          i += op.length;
          if (op === '<<' || op === '<<-') {
            pending = { token, delimiter: null, stripTabs: op === '<<-' };
          }
          continue;
        }

        add('bare', ch);
        i++;
      }
      flush();
      return tokens;
    }

    // --- parser ---

    function shellParse(tokens) {
      let i = 0;
      const peekOp = (value) => tokens[i] && tokens[i].type === 'op' && tokens[i].value === value;

      const parseCommand = () => {
        const words = [];
        const redirs = [];
        while (i < tokens.length) {
          const t = tokens[i];
          if (t.type === 'word') {
            if (t.heredocDelim) { i++; continue; }
            words.push(t);
            i++;
            continue;
          }
          if (['>', '>>', '<', '2>', '2>>', '&>'].includes(t.value)) {
            const target = tokens[i + 1];
            if (!target || target.type !== 'word') { i++; continue; }
            redirs.push({ op: t.value, target });
            i += 2;
            continue;
          }
          if (t.value === '<<' || t.value === '<<-') {
            redirs.push({ op: t.value, heredoc: t.heredoc || '' });
            i++;
            continue;
          }
          if (t.value === '2>&1') { redirs.push({ op: '2>&1' }); i++; continue; }
          break;
        }
        return { words, redirs };
      };

      const parsePipeline = () => {
        const commands = [parseCommand()];
        while (peekOp('|')) { i++; commands.push(parseCommand()); }
        return commands;
      };

      const parseAndOr = () => {
        const chain = [parsePipeline()];
        while (peekOp('&&') || peekOp('||')) {
          const op = tokens[i].value;
          i++;
          chain.push({ op, pipeline: parsePipeline() });
        }
        return chain;
      };

      const script = [];
      while (i < tokens.length) {
        if (peekOp(';') || peekOp('&') || peekOp('|')) { i++; continue; }
        if (tokens[i].type === 'op' && [')'].includes(tokens[i].value)) { i++; continue; }
        script.push(parseAndOr());
        while (peekOp(';') || peekOp('&')) i++;
      }
      return script;
    }

    // --- expansion ---

    function shellLookup(spec, state) {
      const m = /^([A-Za-z_][A-Za-z0-9_]*)(:?-)(.*)$/.exec(spec);
      const name = m ? m[1] : spec;
      const fallback = m ? m[3] : null;
      const value = state.env[name];
      if (fallback !== null) {
        if (value === undefined) return shellExpandStatic(fallback, state);
        if (m[2] === ':-' && value === '') return shellExpandStatic(fallback, state);
      }
      return value === undefined ? '' : value;
    }

    function shellExpandStatic(text, state) {
      return String(text)
        .replace(/\$\{([A-Za-z_][A-Za-z0-9_]*)\}/g, (_, name) => state.env[name] ?? '')
        .replace(/\$([A-Za-z_][A-Za-z0-9_]*)/g, (_, name) => state.env[name] ?? '');
    }

    async function shellExpandVars(text, state, depth) {
      let out = '';
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (ch !== '$') { out += ch; continue; }
        const next = text[i + 1];

        if (next === '(') {
          const inner = shellReadBalanced(text, i + 1);
          if (inner.text.startsWith('(')) {
            out += safeBigIntEval(inner.text.slice(1, -1));
          } else {
            const captured = await runShellScript(inner.text, { depth: (depth || 0) + 1 });
            out += captured.stdout.replace(/\n+$/, '');
            state.status = captured.status;
          }
          i = inner.end;
          continue;
        }

        if (next === '{') {
          const end = text.indexOf('}', i + 2);
          if (end === -1) { out += ch; continue; }
          out += shellLookup(text.slice(i + 2, end), state);
          i = end;
          continue;
        }

        if (next === '?') { out += String(state.status); i++; continue; }
        if (next === '#') { out += '0'; i++; continue; }
        if (next === '$') { out += String(state.pid); i++; continue; }
        if (next === '!') { out += String(state.pid); i++; continue; }
        if (next === '0') { out += 'bash'; i++; continue; }
        if (next === '-') { out += 'himBH'; i++; continue; }

        const nameMatch = /^[A-Za-z_][A-Za-z0-9_]*/.exec(text.slice(i + 1));
        if (nameMatch) {
          out += state.env[nameMatch[0]] ?? '';
          i += nameMatch[0].length;
          continue;
        }

        if (next !== undefined && /[1-9]/.test(next)) { i++; continue; }

        out += ch;
      }
      return out;
    }

    async function shellExpandWord(token, state, depth) {
      const parts = token.parts || [];
      let text = '';
      let sawBare = false;
      for (const part of parts) {
        if (part.kind === 'single') { text += part.text; continue; }
        if (part.kind === 'double') { text += await shellExpandVars(part.text, state, depth); continue; }
        sawBare = true;
        text += await shellExpandVars(part.text, state, depth);
      }

      if (sawBare && text.startsWith('~') && (text === '~' || text.startsWith('~/'))) {
        text = (state.env.HOME || '/') + text.slice(1);
      }

      if (!sawBare) return [text];

      const fields = text.split(/[ \t\n]+/).filter((f) => f.length > 0);
      if (fields.length === 0) return [];
      const expanded = [];
      for (const field of fields) expanded.push(...shellGlob(field, state.cwd));
      return expanded;
    }

    // --- redirect helpers ---

    function shellNullify(text) {
      return text === undefined || text === null ? '' : String(text);
    }

    async function shellWriteTarget(state, rawTarget, text, append) {
      const target = shellResolvePath(state.cwd, rawTarget);
      if (target === '/dev/null') return { ok: true };
      if (append) {
        const existing = vfsReadTextNorm(target);
        const base = existing.missing ? '' : (existing.text || '');
        await vfsWriteTextNorm(target, base + text);
      } else {
        await vfsWriteTextNorm(target, text);
      }
      return { ok: true };
    }

    // --- command dispatch ---

    function shellFormatList(names) {
      return names.join('\n');
    }

    function shellHumanSize(bytes) {
      if (bytes < 1024) return String(bytes);
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'K';
      return (bytes / (1024 * 1024)).toFixed(1) + 'M';
    }

    function shellParseFlags(args) {
      const flags = new Set();
      const rest = [];
      let onlyOperands = false;
      for (const a of args) {
        if (onlyOperands) { rest.push(a); continue; }
        if (a === '--') { onlyOperands = true; continue; }
        if (a.length > 1 && a.startsWith('-') && !/^-\d+$/.test(a)) {
          for (const ch of a.slice(1)) flags.add(ch);
          continue;
        }
        rest.push(a);
      }
      return { flags, args: rest };
    }

    function shellReadInputs(inputs, io) {
      if (inputs.length === 0) return [{ name: null, text: io.stdin }];
      const out = [];
      for (const name of inputs) {
        if (name === '-') { out.push({ name: null, text: io.stdin }); continue; }
        const norm = shellResolvePath(io.state.cwd, name);
        const read = vfsReadTextNorm(norm);
        if (read.missing) { out.push({ name, error: 'No such file or directory' }); continue; }
        if (read.error) { out.push({ name, error: read.error }); continue; }
        out.push({ name, text: read.text });
      }
      return out;
    }

    function shellUnescape(text) {
      return text.replace(/\\(.)/g, (m, c) => {
        if (c === 'n') return '\n';
        if (c === 't') return '\t';
        if (c === 'r') return '\r';
        if (c === '\\') return '\\';
        if (c === 'a') return '\x07';
        if (c === 'b') return '\b';
        if (c === 'f') return '\f';
        if (c === 'v') return '\v';
        if (c === '0') return '\0';
        return c;
      });
    }

    function shellTestExpression(args, state) {
      // Minimal but useful `test` / `[` implementation.
      const path = (p) => shellResolvePath(state.cwd, p);
      const unary = {
        '-e': (p) => !!vfsStatNorm(path(p)),
        '-f': (p) => { const s = vfsStatNorm(path(p)); return !!s && !s.isDir; },
        '-d': (p) => { const s = vfsStatNorm(path(p)); return !!s && s.isDir; },
        '-s': (p) => { const s = vfsStatNorm(path(p)); return !!s && s.size > 0; },
        '-r': (p) => !!vfsStatNorm(path(p)),
        '-w': (p) => !!vfsStatNorm(path(p)),
        '-x': (p) => !!vfsStatNorm(path(p)),
        '-z': (p) => p === '',
        '-n': (p) => p !== ''
      };
      let i = 0;
      let negate = false;
      if (args[i] === '!') { negate = true; i++; }
      const a = args[i];
      if (a === undefined) return negate;
      if (unary[a] && args.length === i + 2) {
        const res = unary[a](args[i + 1]);
        return negate ? !res : res;
      }
      if (args.length === i + 3) {
        const left = a;
        const op = args[i + 1];
        const right = args[i + 2];
        let res;
        if (op === '=' || op === '==') res = left === right;
        else if (op === '!=') res = left !== right;
        else if (op === '-eq') res = Number(left) === Number(right);
        else if (op === '-ne') res = Number(left) !== Number(right);
        else if (op === '-lt') res = Number(left) < Number(right);
        else if (op === '-le') res = Number(left) <= Number(right);
        else if (op === '-gt') res = Number(left) > Number(right);
        else if (op === '-ge') res = Number(left) >= Number(right);
        else res = left !== '';
        return negate ? !res : res;
      }
      return negate ? !(a !== '') : a !== '';
    }

    async function shellRunPython(args, io) {
      let script = '';
      if (args[0] === '-c') script = args.slice(1).join(' ');
      else if (args[0] && !args[0].startsWith('-')) {
        const norm = shellResolvePath(io.state.cwd, args[0]);
        const read = vfsReadTextNorm(norm);
        if (read.missing) return { stdout: '', stderr: `python: can't open file '${args[0]}': No such file or directory`, status: 2 };
        script = read.text;
      } else {
        script = io.stdin;
      }
      if (!script.trim()) return { stdout: 'Python 3.12 (Pyodide Wasm Engine)', stderr: '', status: 0 };
      try {
        const py = await initPyodide();
        syncVfsToPyodide();
        const logs = [];
        py.setStdout({ batched: (s) => logs.push(s) });
        const res = await py.runPythonAsync(script);
        syncPyodideToVfs();
        let out = logs.join('\n');
        if (res !== undefined) out += (out ? '\n' : '') + String(res);
        return { stdout: out, stderr: '', status: 0 };
      } catch (e) {
        try { syncPyodideToVfs(); } catch (ignored) {}
        return { stdout: '', stderr: `Python Error: ${e && e.message ? e.message : String(e)}`, status: 1 };
      }
    }

    async function shellExec(name, args, io) {
      const state = io.state;
      const ok = (stdout, status) => ({ stdout: shellNullify(stdout), stderr: '', status: status || 0 });
      const fail = (message, status) => ({ stdout: '', stderr: message, status: status === undefined ? 1 : status });

      switch (name) {
        case ':':
        case 'true':
          return ok('');

        case 'false':
          return { stdout: '', stderr: '', status: 1 };

        case 'echo': {
          let newline = true;
          let escapes = false;
          let i = 0;
          while (args[i] === '-n' || args[i] === '-e' || args[i] === '-E' || args[i] === '-ne' || args[i] === '-en') {
            if (args[i].includes('n')) newline = false;
            if (args[i].includes('e')) escapes = true;
            if (args[i].includes('E')) escapes = false;
            i++;
          }
          let text = args.slice(i).join(' ');
          if (escapes) text = shellUnescape(text);
          return ok(newline ? text + '\n' : text);
        }

        case 'printf': {
          if (args.length === 0) return ok('');
          let format = args[0];
          const values = args.slice(1);
          let vi = 0;
          let out = '';
          let guard = 0;
          do {
            let chunk = '';
            for (let i = 0; i < format.length; i++) {
              const ch = format[i];
              if (ch === '\\') {
                const seq = format.slice(i, i + 2);
                chunk += shellUnescape(seq);
                i++;
                continue;
              }
              if (ch === '%') {
                const spec = format[i + 1];
                if (spec === '%') { chunk += '%'; i++; continue; }
                if (spec === 's' || spec === 'd' || spec === 'i' || spec === 'f' || spec === 'c' || spec === 'b') {
                  const raw = values[vi++] ?? '';
                  if (spec === 'd' || spec === 'i') chunk += String(parseInt(raw, 10) || 0);
                  else if (spec === 'f') chunk += String(parseFloat(raw) || 0);
                  else if (spec === 'c') chunk += String(raw).slice(0, 1);
                  else if (spec === 'b') chunk += shellUnescape(String(raw));
                  else chunk += String(raw);
                  i++;
                  continue;
                }
                chunk += ch;
                continue;
              }
              chunk += ch;
            }
            out += chunk;
            guard++;
          } while (vi < values.length && guard < 10000);
          return ok(out);
        }

        case 'cat': {
          const { flags, args: files } = shellParseFlags(args);
          const inputs = shellReadInputs(files, io);
          let out = '';
          let status = 0;
          let lineNo = 1;
          for (const input of inputs) {
            if (input.error) { return { stdout: out, stderr: `cat: ${input.name}: ${input.error}`, status: 1 }; }
            if (flags.has('n')) {
              out += input.text.split('\n').map((l) => `${String(lineNo++).padStart(6, ' ')}\t${l}`).join('\n');
            } else {
              out += input.text;
            }
          }
          return ok(out, status);
        }

        case 'ls': {
          const { flags, args: targets } = shellParseFlags(args);
          const showAll = flags.has('a') || flags.has('A');
          const long = flags.has('l');
          const recursive = flags.has('R');
          const listTargets = targets.length > 0 ? targets : ['.'];
          const chunks = [];
          let status = 0;

          const formatEntry = (base, entry) => {
            if (!long) return entry.name;
            const kind = entry.isDir ? 'd' : '-';
            const size = entry.isDir ? '4096' : String(entry.size);
            const date = new Date(entry.mtime).toISOString().slice(0, 16).replace('T', ' ');
            return `${kind}rw-r--r--  alex  alex  ${size.padStart(6, ' ')}  ${date}  ${entry.name}${entry.isDir ? '/' : ''}`;
          };

          const listDir = (displayPath, norm, header) => {
            const entries = vfsListNorm(norm).filter((e) => showAll || !e.name.startsWith('.'));
            if (header) chunks.push(`${displayPath}:`);
            chunks.push(entries.length === 0 ? '' : entries.map((e) => formatEntry(displayPath, e)).filter(Boolean).join('\n'));
            if (recursive) {
              for (const e of entries) {
                if (!e.isDir) continue;
                const childDisplay = displayPath === '/' ? '/' + e.name : displayPath.replace(/\/$/, '') + '/' + e.name;
                const childNorm = norm === '/' ? '/' + e.name : norm + '/' + e.name;
                chunks.push('');
                listDir(childDisplay, childNorm, true);
              }
            }
          };

          for (const target of listTargets) {
            const norm = shellResolvePath(state.cwd, target);
            const st = vfsStatNorm(norm);
            if (!st) { chunks.push(`ls: cannot access '${target}': No such file or directory`); status = 2; continue; }
            if (!st.isDir) { chunks.push(formatEntry('', { name: target, isDir: false, size: st.size, mtime: st.mtime })); continue; }
            listDir(target, norm, listTargets.length > 1);
            if (listTargets.length > 1 && target !== listTargets[listTargets.length - 1]) chunks.push('');
          }
          return ok(chunks.filter((c) => c !== undefined && c !== null).join('\n').replace(/\n+$/, ''), status);
        }

        case 'pwd':
          return ok(state.cwd + '\n');

        case 'cd': {
          const target = args[0] === undefined || args[0] === '' ? (state.env.HOME || '/') : (args[0] === '-' ? (state.env.OLDPWD || '/') : args[0]);
          const norm = shellResolvePath(state.cwd, target);
          const st = vfsStatNorm(norm);
          if (!st) return fail(`cd: ${target}: No such file or directory`);
          if (!st.isDir) return fail(`cd: ${target}: Not a directory`);
          const prev = state.cwd;
          state.cwd = norm;
          state.env.OLDPWD = prev;
          state.env.PWD = norm;
          if (args[0] === '-') return ok(norm + '\n');
          return ok('');
        }

        case 'mkdir': {
          const { flags, args: paths } = shellParseFlags(args);
          if (paths.length === 0) return fail('mkdir: missing operand');
          for (const p of paths) {
            const norm = shellResolvePath(state.cwd, p);
            if (vfsStatNorm(norm)) {
              if (!flags.has('p')) return fail(`mkdir: cannot create directory '${p}': File exists`);
              continue;
            }
            if (!flags.has('p')) {
              const parent = norm.split('/').slice(0, -1).join('/') || '/';
              const pst = vfsStatNorm(parent);
              if (!pst || !pst.isDir) return fail(`mkdir: cannot create directory '${p}': No such file or directory`);
            }
            await opfs.makeDir(norm);
          }
          return ok('');
        }

        case 'rmdir': {
          if (args.length === 0) return fail('rmdir: missing operand');
          for (const p of args) {
            const norm = shellResolvePath(state.cwd, p);
            const st = vfsStatNorm(norm);
            if (!st || !st.isDir) return fail(`rmdir: failed to remove '${p}': No such file or directory`);
            if (vfsListNorm(norm).length > 0) return fail(`rmdir: failed to remove '${p}': Directory not empty`);
            await vfsRemoveNorm(norm, true);
          }
          return ok('');
        }

        case 'rm': {
          const { flags, args: paths } = shellParseFlags(args);
          if (paths.length === 0) return fail('rm: missing operand');
          const recursive = flags.has('r') || flags.has('R');
          const force = flags.has('f');
          for (const p of paths) {
            const norm = shellResolvePath(state.cwd, p);
            const st = vfsStatNorm(norm);
            if (!st) {
              if (force) continue;
              return fail(`rm: cannot remove '${p}': No such file or directory`);
            }
            if (st.isDir && !recursive) return fail(`rm: cannot remove '${p}': Is a directory`);
            const res = await vfsRemoveNorm(norm, recursive);
            if (res.error && !force) return fail(`rm: cannot remove '${p}': ${res.error}`);
          }
          return ok('');
        }

        case 'cp': {
          const { flags, args: operands } = shellParseFlags(args);
          if (operands.length < 2) return fail('cp: missing destination file operand');
          const recursive = flags.has('r') || flags.has('R');
          const destRaw = operands[operands.length - 1];
          const sources = operands.slice(0, -1);
          const destNorm = shellResolvePath(state.cwd, destRaw);
          const destStat = vfsStatNorm(destNorm);
          const copyOne = async (srcRaw, targetNorm) => {
            const srcNorm = shellResolvePath(state.cwd, srcRaw);
            const st = vfsStatNorm(srcNorm);
            if (!st) return `cp: cannot stat '${srcRaw}': No such file or directory`;
            if (st.isDir) {
              if (!recursive) return `cp: -r not specified; omitting directory '${srcRaw}'`;
              await opfs.makeDir(targetNorm);
              for (const entry of vfsListNorm(srcNorm)) {
                const msg = await copyOne(
                  srcNorm + '/' + entry.name,
                  targetNorm + '/' + entry.name
                );
                if (msg) return msg;
              }
              return null;
            }
            const read = vfsReadTextNorm(srcNorm);
            if (read.missing) return `cp: cannot stat '${srcRaw}': No such file or directory`;
            if (read.error) return `cp: ${srcRaw}: ${read.error}`;
            await vfsWriteTextNorm(targetNorm, read.text);
            return null;
          };
          for (const src of sources) {
            const target = (destStat && destStat.isDir) ? destNorm + '/' + src.split('/').filter(Boolean).pop() : destNorm;
            const err = await copyOne(src, target);
            if (err) return fail(err);
          }
          return ok('');
        }

        case 'mv': {
          const operands = args.filter((a) => !a.startsWith('-'));
          if (operands.length < 2) return fail('mv: missing destination file operand');
          const destNorm = shellResolvePath(state.cwd, operands[operands.length - 1]);
          const destStat = vfsStatNorm(destNorm);
          for (const src of operands.slice(0, -1)) {
            const srcNorm = shellResolvePath(state.cwd, src);
            const st = vfsStatNorm(srcNorm);
            if (!st) return fail(`mv: cannot stat '${src}': No such file or directory`);
            const target = (destStat && destStat.isDir) ? destNorm + '/' + src.split('/').filter(Boolean).pop() : destNorm;
            if (st.isDir) {
              const entries = vfsListNorm(srcNorm);
              for (const entry of entries) {
                const sub = vfsReadTextNorm(srcNorm + '/' + entry.name);
                if (sub.text !== undefined) await vfsWriteTextNorm(target + '/' + entry.name, sub.text);
                else await opfs.makeDir(target + '/' + entry.name);
              }
            } else {
              const read = vfsReadTextNorm(srcNorm);
              await vfsWriteTextNorm(target, read.text || '');
            }
            await vfsRemoveNorm(srcNorm, true);
          }
          return ok('');
        }

        case 'touch': {
          if (args.length === 0) return fail('touch: missing file operand');
          for (const p of args.filter((a) => !a.startsWith('-'))) {
            const norm = shellResolvePath(state.cwd, p);
            if (vfsStatNorm(norm)) continue;
            await vfsWriteTextNorm(norm, '');
          }
          return ok('');
        }

        case 'head':
        case 'tail': {
          const isHead = name === 'head';
          let count = 10;
          const files = [];
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            if (a === '-n' || a === '--lines') { count = parseInt(args[++i], 10) || 10; continue; }
            if (/^-n\d+$/.test(a)) { count = parseInt(a.slice(2), 10) || 10; continue; }
            if (/^-\d+$/.test(a)) { count = parseInt(a.slice(1), 10) || 10; continue; }
            if (a.length > 1 && a.startsWith('-')) continue;
            files.push(a);
          }
          const inputs = shellReadInputs(files, io);
          const chunks = [];
          for (const input of inputs) {
            if (input.error) return fail(`${name}: cannot open '${input.name}' for reading: ${input.error}`);
            const lines = input.text.split('\n');
            if (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
            chunks.push(isHead ? lines.slice(0, count).join('\n') : lines.slice(Math.max(0, lines.length - count)).join('\n'));

          return ok(chunks.join('\n'));
        }

        case 'wc': {
          const { flags, args: files } = shellParseFlags(args);
          const inputs = shellReadInputs(files, io);
          const lines = [];
          let totalL = 0, totalW = 0, totalC = 0;
          const counts = (text) => {
            const l = text === '' ? 0 : text.split('\n').length - (text.endsWith('\n') ? 1 : 0);
            const w = text.split(/\s+/).filter(Boolean).length;
            const c = new TextEncoder().encode(text).length;
            return { l, w, c, m: [...text].length };

          for (const input of inputs) {
            if (input.error) return fail(`wc: ${input.name}: ${input.error}`);

            totalL += n.l; totalW += n.w; totalC += n.c;
            const parts = [];
            if (flags.has('l')) parts.push(n.l);
            if (flags.has('w')) parts.push(n.w);
            if (flags.has('m')) parts.push(n.m);
            if (flags.has('c') || parts.length === 0) parts.push(flags.has('m') ? n.m : n.c);
            lines.push(parts.join(' ').padStart(7, ' ') + (input.name ? ' ' + input.name : ''));

          if (inputs.length > 1) {
            const parts = [];
            if (flags.has('l')) parts.push(totalL);
            if (flags.has('w')) parts.push(totalW);
            if (flags.has('c') || parts.length === 0) parts.push(totalC);
            lines.push(parts.join(' ').padStart(7, ' ') + ' total');
          }
          return ok(lines.join('\n'));
        }

        case 'grep': {
          const flags = new Set();
          const operands = [];
          let pattern = null;
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            if (pattern === null && a.length > 1 && a.startsWith('-') && !/^-\d+$/.test(a)) {
              for (const ch of a.slice(1)) flags.add(ch);
              continue;

            if (a === '-e' && args[i + 1]) { pattern = args[++i]; continue; }
            if (pattern === null) { pattern = a; continue; }
            operands.push(a);
          }
          if (pattern === null) return fail('grep: missing pattern');
          let re;

            const body = flags.has('F') ? pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : pattern;

            return fail(`grep: invalid pattern: ${e.message}`, 2);

          const inputs = shellReadInputs(operands, io);
          const showName = inputs.length > 1 || (inputs.length === 1 && inputs[0].name !== null);

          let matchedAny = false;
          for (const input of inputs) {
            if (input.error) continue;
            const rows = input.text.split('\n');
            let fileMatches = 0;
            for (let idx = 0; idx < rows.length; idx++) {
              const hits = re.test(rows[idx]);
              if (flags.has('v') ? !hits : hits) {
                fileMatches++;
                if (flags.has('q')) { matchedAny = true; break; }
                if (flags.has('l')) break;
                if (flags.has('c')) continue;

                if (flags.has('n')) line = `${idx + 1}:${line}`;
                if (showName) line = `${input.name}:${line}`;
                lines.push(line);
              }

            if (fileMatches > 0) matchedAny = true;
            if (flags.has('l') && fileMatches > 0) lines.push(input.name);
            if (flags.has('c')) lines.push((showName ? input.name + ':' : '') + fileMatches);

          return { stdout: lines.join('\n'), stderr: '', status: matchedAny ? 0 : 1 };

        case 'sed': {
          const operands = args.filter((a) => !a.startsWith('-'));

          if (!script) return fail('sed: no script supplied');
          const m = /^s(.)(.*?)\1(.*?)\1([gi]*)$/.exec(script);
          if (!m) return fail(`sed: unsupported script '${script}'`);
          const flags = m[4] || '';

          try { re = new RegExp(m[2], flags.includes('g') ? (flags.includes('i') ? 'gi' : 'g') : (flags.includes('i') ? 'i' : '')); }

          const inputs = shellReadInputs(operands, io);
          const out = [];
          for (const input of inputs) {
            if (input.error) return fail(`sed: can't read ${input.name}: ${input.error}`);

          return ok(out.join('\n'));
        }

        case 'sort': {
          const { flags, args: files } = shellParseFlags(args);
          const inputs = shellReadInputs(files, io);
          let lines = inputs.flatMap((i) => (i.error ? [] : i.text.split('\n')));
          if (lines.length > 0 && lines[lines.length - 1] === '') lines.pop();
          if (flags.has('n')) lines.sort((a, b) => (parseFloat(a) || 0) - (parseFloat(b) || 0));
          else lines.sort();
          if (flags.has('r')) lines.reverse();
          if (flags.has('u')) lines = lines.filter((l, idx) => idx === 0 || l !== lines[idx - 1]);

        case 'uniq': {
          const lines = io.stdin.split('\n');
          const out = [];
          let prev = null;
          let count = 0;
          for (const line of lines) {
            if (line === prev) { count++; continue; }
            if (prev !== null) out.push(args.includes('-c') ? `${String(count).padStart(4, ' ')} ${prev}` : prev);
            prev = line;
            count = 1;
          }
          if (prev !== null) out.push(args.includes('-c') ? `${String(count).padStart(4, ' ')} ${prev}` : prev);
          return ok(out.join('\n'));
        }

        case 'tr': {
          const [from, to] = args;
          if (!from || !to) return fail('tr: missing operand');
          const expand = (spec) => {
            let out = '';
            for (let i = 0; i < spec.length; i++) {
              if (spec[i + 1] === '-' && spec[i + 2] && spec[i + 2] !== ']') {
                const a = spec.charCodeAt(i);
                const b = spec.charCodeAt(i + 2);
                for (let c = a; c <= b; c++) out += String.fromCharCode(c);
                i += 2;
              } else out += spec[i];
            }
            return out;
          };
          const src = expand(from);
          const dst = expand(to);
          const map = new Map();
          for (let i = 0; i < src.length; i++) map.set(src[i], dst[i] ?? dst[dst.length - 1] ?? '');

        case 'find': {
          let start = '.';
          let namePattern = null;
          let typeFilter = null;
          let maxDepth = Infinity;
          const positional = [];
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            if (a === '-name') { namePattern = args[++i] || null; continue; }
            if (a === '-type') { typeFilter = args[++i] || null; continue; }
            if (a === '-maxdepth') { maxDepth = parseInt(args[++i], 10); continue; }
            if (a.startsWith('-')) continue;
            positional.push(a);
          }
          if (positional.length > 0) start = positional[0];
          const startNorm = shellResolvePath(state.cwd, start);
          const startStat = vfsStatNorm(startNorm);
          if (!startStat) return fail(`find: '${start}': No such file or directory`);
          let re = null;
          if (namePattern) {
            try { re = globToRegExp(namePattern); } catch (e) { re = null; }

          const results = [];
          const walk = (norm, depth) => {
            const st = vfsStatNorm(norm);

            const base = norm.split('/').filter(Boolean).pop() || '/';
            const nameOk = !re || re.test(base);
            const typeOk = !typeFilter || (typeFilter === 'd' ? st.isDir : typeFilter === 'f' ? !st.isDir : true);

            if (!st.isDir || depth >= maxDepth) return;
            for (const entry of vfsListNorm(norm)) {

          walk(startNorm, 0);
          if (results.length === 0) return { stdout: '', stderr: '', status: 0 };
          return ok(results.join('\n'));
        }

        case 'tree': {
          const root = shellResolvePath(state.cwd, args[0] || '.');

          let dirs = 0, files = 0;

            });

          walk(root, '');

          return ok(lines.join('\n'));
        }

        case 'basename': {
          if (!args[0]) return fail('basename: missing operand');
          const trimmed = args[0].replace(/\/+$/, '');
          const base = trimmed.split('/').filter(Boolean).pop() || '/';
          if (args[1] && base.endsWith(args[1])) return ok(base.slice(0, -args[1].length));
          return ok(base);
        }

        case 'dirname': {
          if (!args[0]) return fail('dirname: missing operand');
          const parts = shellResolvePath(state.cwd, args[0]).split('/').filter(Boolean);
          parts.pop();
          return ok('/' + parts.join('/'));
        }

        case 'realpath': {
          if (!args[0]) return fail('realpath: missing operand');
          const norm = shellResolvePath(state.cwd, args[0]);
          if (!vfsStatNorm(norm)) return fail(`realpath: ${args[0]}: No such file or directory`);
          return ok(norm);
        }

        case 'test':
        case '[': {
          const expr = name === '[' ? args.filter((a, i) => !(i === args.length - 1 && a === ']')) : args;
          return { stdout: '', stderr: '', status: shellTestExpression(expr, state) ? 0 : 1 };

            if (eq === -1) { if (state.env[a] === undefined) state.env[a] = ''; continue; }

        }

        case 'unset': {
          for (const a of args) delete state.env[a];
          return ok('');
        }

        case 'set':
        case 'env':
        case 'printenv': {

        case 'which':
        case 'command':
        case 'type': {
          const target = args.filter((a) => !a.startsWith('-')).pop() || '';
          const known = SHELL_COMMANDS.has(target);
          if (!known) return { stdout: '', stderr: `${name}: ${target}: not found`, status: 1 };
          return ok('/usr/bin/' + target);
        }

        case 'seq': {
          const nums = args.filter((a) => !a.startsWith('-')).map(Number);

          const end = nums.length === 1 ? nums[0] : (nums[1] || 1);
          const step = nums.length >= 3 ? (nums[2] || 1) : 1;
          const out = [];
          if (step > 0) for (let v = start; v <= end; v += step) out.push(v);
          else for (let v = start; v >= end; v += step) out.push(v);
          return ok(out.join('\n'));
        }

        case 'expr': {
          const joined = args.join(' ');
          if (/^[-+*/%() 0-9^]+$/.test(joined)) return ok(safeBigIntEval(joined));
          return fail(`expr: syntax error`);
        }

        case 'date': {
          const fmtIdx = args.indexOf('+%Y-%m-%d');
          const now = new Date();
          if (args.includes('+%s')) return ok(String(Math.floor(now.getTime() / 1000)));
          const pad = (v) => String(v).padStart(2, '0');

              .replace(/%m/g, pad(now.getMonth() + 1))
              .replace(/%d/g, pad(now.getDate()))
              .replace(/%H/g, pad(now.getHours()))
              .replace(/%M/g, pad(now.getMinutes()))
              .replace(/%S/g, pad(now.getSeconds())));
          }
          return ok(now.toUTCString());
        }

        case 'sleep': {
          const secs = parseFloat(args[0]) || 0;

        }

        case 'curl': {
          const url = args.find((a) => a.startsWith('http://') || a.startsWith('https://')) || '';

        case 'uname': {

          if (args.includes('-m')) return ok('wasm32');

        }

        case 'whoami':
          return ok(state.env.USER + '\n');

        case 'hostname':
          return ok('deepupgrade-wasm\n');

        case 'id':
          return ok(`uid=1000(${state.env.USER}) gid=1000(${state.env.USER}) groups=1000(${state.env.USER})\n`);

        case 'clear':
          return ok('');

        case 'more':
        case 'less': {

        }

        case 'diff': {
          const a = args[0];
          const b = args[1];
          if (!a || !b) return fail('diff: missing operand');
          const left = vfsReadTextNorm(shellResolvePath(state.cwd, a));
          const right = vfsReadTextNorm(shellResolvePath(state.cwd, b));
          if (left.missing) return fail(`diff: ${a}: No such file or directory`, 2);
          if (right.missing) return fail(`diff: ${b}: No such file or directory`, 2);
