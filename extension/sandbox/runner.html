          const rLines = right.text.split('\n');
          const out = [`--- ${a}`, `+++ ${b}`];
          const max = Math.max(lLines.length, rLines.length);
          for (let i = 0; i < max; i++) {
            if (lLines[i] === rLines[i]) continue;
            if (lLines[i] !== undefined) out.push(`-${lLines[i]}`);
            if (rLines[i] !== undefined) out.push(`+${rLines[i]}`);
          }
          return { stdout: out.join('\n'), stderr: '', status: 1 };
        }

        case 'git':
          return fail('git: not available in the WASM sandbox (no git binary, no subprocess). Use the "js" tool with https://api.github.com + raw.githubusercontent.com to import files one by one.');

        case 'exit': {
          const code = parseInt(args[0], 10);
          state.exit = Number.isNaN(code) ? 0 : code;
          return { stdout: '', stderr: '', status: state.exit };
        }

        default:
          return fail(`${name}: command not found`, 127);
      }
    }

    const SHELL_COMMANDS = new Set([
      'echo', 'printf', 'cat', 'ls', 'pwd', 'cd', 'mkdir', 'rmdir', 'rm', 'cp', 'mv',
      'touch', 'head', 'tail', 'wc', 'grep', 'sed', 'sort', 'uniq', 'tr', 'find', 'tree',
      'basename', 'dirname', 'realpath', 'test', '[', 'export', 'unset', 'set', 'env',
      'printenv', 'which', 'command', 'type', 'seq', 'expr', 'date', 'sleep', 'curl',
      'python', 'python3', 'uname', 'whoami', 'hostname', 'id', 'clear', 'more', 'less',
      'diff', 'git', 'true', 'false', 'exit', ':'
    ]);

    async function shellRunCommand(command, stdin, io) {
      const state = io.state;
      const argv = [];
      for (const word of command.words) {
        const expanded = await shellExpandWord(word, state, io.depth);
        argv.push(...expanded);
      }

      let input = stdin;
      const outRedirs = [];
      let mergeStderr = false;

      for (const redir of command.redirs) {
        if (redir.op === '2>&1') { mergeStderr = true; continue; }
        if (redir.op === '<<' || redir.op === '<<-') { input = redir.heredoc || ''; continue; }
        const target = (await shellExpandWord(redir.target, state, io.depth));
        const targetPath = target.length > 0 ? target[0] : '';
        if (redir.op === '<') {
          const read = vfsReadTextNorm(shellResolvePath(state.cwd, targetPath));
          if (read.missing) {
            return { stdout: '', stderr: `bash: ${targetPath}: No such file or directory`, status: 1 };
          }
          input = read.text || '';
          continue;
        }
        outRedirs.push({ op: redir.op, path: targetPath });
      }

      let result = { stdout: '', stderr: '', status: 0 };
      let commandIndex = 0;
      while (commandIndex < argv.length && /^[A-Za-z_][A-Za-z0-9_]*=/.test(argv[commandIndex])) {
        const eq = argv[commandIndex].indexOf('=');
        state.env[argv[commandIndex].slice(0, eq)] = argv[commandIndex].slice(eq + 1);
        commandIndex++;
      }
      if (commandIndex >= argv.length) {
        result = { stdout: input, stderr: '', status: 0 };
      } else {
        const name = argv[commandIndex];
        try {
          result = await shellExec(name, argv.slice(commandIndex + 1), {
            stdin: input,
            state,
            depth: io.depth,
            io
          });
        } catch (e) {
          result = { stdout: '', stderr: `${name}: ${e && e.message ? e.message : String(e)}`, status: 1 };
        }
      }

      if (mergeStderr) {
        result = {
          stdout: [result.stdout, result.stderr].filter((s) => s !== '').join('\n'),
          stderr: '',
          status: result.status
        };
      }

      for (const redir of outRedirs) {
        if (!redir.path) continue;
        try {
          if (redir.op === '2>') {
            await shellWriteTarget(state, redir.path, result.stderr, false);
            result = { stdout: result.stdout, stderr: '', status: result.status };
          } else if (redir.op === '2>>') {
            await shellWriteTarget(state, redir.path, result.stderr, true);
            result = { stdout: result.stdout, stderr: '', status: result.status };
          } else if (redir.op === '&>') {
            const both = [result.stdout, result.stderr].filter((s) => s !== '').join('\n');
            await shellWriteTarget(state, redir.path, both, false);
            result = { stdout: '', stderr: '', status: result.status };
          } else if (redir.op === '>>') {
            await shellWriteTarget(state, redir.path, result.stdout, true);
            result = { stdout: '', stderr: result.stderr, status: result.status };
          } else {
            await shellWriteTarget(state, redir.path, result.stdout, false);
            result = { stdout: '', stderr: result.stderr, status: result.status };
          }
        } catch (e) {
          result = { stdout: '', stderr: `bash: ${redir.path}: ${e && e.message ? e.message : String(e)}`, status: 1 };
        }
      }

      return result;
    }

    async function shellRunPipeline(pipeline, io) {
      let input = '';
      let finalOut = '';
      const errs = [];
      let status = 0;
      for (let i = 0; i < pipeline.length; i++) {
        const isLast = i === pipeline.length - 1;
        const res = await shellRunCommand(pipeline[i], input, io);
        status = res.status;
        if (res.stderr) errs.push(res.stderr);
        input = res.stdout;
        if (isLast) finalOut = res.stdout;
      }
      return { stdout: finalOut, stderr: errs.join('\n'), status };
    }

    async function shellRunAndOr(chain, io) {
      let stdout = '';
      let stderr = '';
      let res = await shellRunPipeline(chain[0], io);
      stdout = res.stdout;
      stderr = res.stderr;
      let status = res.status;
      for (let i = 1; i < chain.length; i++) {
        const step = chain[i];
        if (step.op === '&&' && status !== 0) continue;
        if (step.op === '||' && status === 0) continue;
        res = await shellRunPipeline(step.pipeline, io);
        stdout += res.stdout;
        stderr += res.stderr;
        status = res.status;
      }
      return { stdout, stderr, status };
    }

    async function runShellScript(script, options = {}) {
      const state = shellState();
      if (!options.depth) shellResetExit();
      const depth = options.depth || 0;
      const out = [];
      const errs = [];
      let status = 0;

      const tokens = shellLex(String(script || ''));
      const chains = shellParse(tokens);

      for (const chain of chains) {
        const res = await shellRunAndOr(chain, { state, depth });
        state.status = res.status;
        status = res.status;
        if (res.stdout) out.push(res.stdout);
        if (res.stderr) errs.push(res.stderr);
        if (state.exit !== null) break;
      }

      const stdout = out.join('');
      const stderr = errs.join('');
      const output = [stdout, stderr].filter((s) => s !== '').join('\n').replace(/\n+$/, '');
      return { output, stdout, stderr, status };
    }
    // </du-posix-shell>

    // 5. MESSAGE HANDLER FOR CONTENT SCRIPT
    window.addEventListener('message', async (event) => {
      const { id, type, tool, code } = event.data;
      if (type !== 'DU_RUN') return;

      // Never answer a tool call before the durable VFS has been restored.
      await waitForVfsBoot();

      const startTime = performance.now();
      let output = '';

      try {
        if ((tool === 'bash' || tool === 'python' || tool === 'py' || tool === 'js') &&
            (typeof code !== 'string' || code.trim() === '')) {
          throw new Error(`Tool "${tool}" requires a non-empty "code" field (the tool block was not parsed correctly).`);
        }

        if (tool === 'bash') {
          const shellResult = await runShellScript(code);
          output = shellResult.output;
          if (shellResult.status !== 0) {
            const detail = shellResult.output || `Command exited with code ${shellResult.status}`;
            throw new Error(detail);
          }

        } else if (tool === 'question' || tool === 'ask') {
          const questionText = event.data.question || event.data.prompt || 'Требуется ваш выбор:';
          output = `[QUESTION PROMPTED TO USER]: "${questionText}"\nWaiting for user interactive selection...`;

        } else if (tool === 'glob') {
          const pattern = event.data.pattern || event.data.glob || '*';
          const searchPath = event.data.path || '/';
          const normSearch = opfs.normalizePath(searchPath);

          // Convert glob pattern to RegExp
          let regexStr = pattern
            .replace(/[.+^${}()|[\]\\]/g, '\\$&')
            .replace(/\*\*/g, '.*')
            .replace(/(?<!\.)\*/g, '[^/]*')
            .replace(/\?/g, '[^/]');
          const globRegex = new RegExp(`^${regexStr}$`, 'i');

          const matches = [];
          for (const [p, item] of opfs.files.entries()) {
            if (item.isDir) continue;
            if (normSearch !== '/' && !p.startsWith(normSearch)) continue;

            const relPath = normSearch === '/' ? p.slice(1) : p.slice(normSearch.length).replace(/^\//, '');
            const baseName = p.split('/').filter(Boolean).pop() || '';

            if (globRegex.test(p) || globRegex.test(relPath) || globRegex.test(baseName)) {
              matches.push({ path: p, mtime: item.mtime, size: item.size });
            }
          }

          // Also check Pyodide FS files if active
          if (pyodideInstance && pyodideInstance.FS) {
            function scanPyodideDir(dir) {
              try {
                const entries = pyodideInstance.FS.readdir(dir);
                for (const e of entries) {
                  if (e === '.' || e === '..') continue;
                  const full = (dir === '/' ? '' : dir) + '/' + e;
                  try {
                    const st = pyodideInstance.FS.stat(full);
                    if (pyodideInstance.FS.isDir(st.mode)) {
                      if (!full.startsWith('/lib') && !full.startsWith('/dev') && !full.startsWith('/proc')) {
                        scanPyodideDir(full);
                      }
                    } else {
                      if (normSearch !== '/' && !full.startsWith(normSearch)) continue;
                      const rel = normSearch === '/' ? full.slice(1) : full.slice(normSearch.length).replace(/^\//, '');
                      if (globRegex.test(full) || globRegex.test(rel) || globRegex.test(e)) {
                        if (!matches.some(m => m.path === full)) {
                          matches.push({ path: full, mtime: st.mtime.getTime ? st.mtime.getTime() : Date.now(), size: st.size });
                        }
                      }
                    }
                  } catch (err) {}
                }
              } catch (err) {}
            }
            scanPyodideDir('/');
          }

          // Sort by mtime descending
          matches.sort((a, b) => b.mtime - a.mtime);
          output = matches.length > 0 ? matches.map(m => m.path).join('\n') : `No files found matching pattern '${pattern}'`;

        } else if (tool === 'grep') {
          const pattern = event.data.pattern || event.data.query || '';
          const searchPath = event.data.path || '/';
          const filePattern = event.data.include || event.data.glob || '';
          const normSearch = opfs.normalizePath(searchPath);

          if (!pattern) throw new Error('Parameter "pattern" is required for grep tool');

          let searchRegex;
          try {
            searchRegex = new RegExp(pattern, 'i');
          } catch (e) {
            searchRegex = new RegExp(pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
          }

          let fileRegex = null;
          if (filePattern) {
            const fStr = filePattern.replace(/[.+^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*');
            fileRegex = new RegExp(`^${fStr}$`, 'i');
          }

          const grepResults = [];
          for (const [p, item] of opfs.files.entries()) {
            if (item.isDir || typeof item.content !== 'string') continue;
            if (normSearch !== '/' && !p.startsWith(normSearch)) continue;

            const baseName = p.split('/').filter(Boolean).pop() || '';
            if (fileRegex && !fileRegex.test(baseName) && !fileRegex.test(p)) continue;

            const lines = item.content.split('\n');
            for (let idx = 0; idx < lines.length; idx++) {
              if (searchRegex.test(lines[idx])) {
                grepResults.push(`${p}:${idx + 1}: ${lines[idx]}`);
                if (grepResults.length >= 200) break;
              }
            }
            if (grepResults.length >= 200) break;
          }

          // Search files that exist only in the Pyodide FS (created by `python`).
          if (isPyodideFsReady() && grepResults.length < 200) {
            for (const f of collectPyodideFiles(normSearch)) {
              if (grepResults.length >= 200) break;
              if (opfs.files.has(f.path)) continue;
              const text = readPyodideText(f.path);
              if (text === null) continue;
              const baseName = f.path.split('/').filter(Boolean).pop() || '';
              if (fileRegex && !fileRegex.test(baseName) && !fileRegex.test(f.path)) continue;
              const lines = text.split('\n');
              for (let idx = 0; idx < lines.length; idx++) {
                if (searchRegex.test(lines[idx])) {
                  grepResults.push(`${f.path}:${idx + 1}: ${lines[idx]}`);
                  if (grepResults.length >= 200) break;
                }
              }
            }
          }

          output = grepResults.length > 0 ? grepResults.join('\n') : `No matches found for '${pattern}' in ${searchPath}`;

        } else if (tool === 'read') {
          const filePath = event.data.path || event.data.file || '';
          const offset = Math.max(1, parseInt(event.data.offset || '1', 10));
          const limit = event.data.limit !== undefined ? parseInt(event.data.limit, 10) : 2000;

          if (!filePath) throw new Error('Parameter "path" is required for read tool');
          let raw = await opfs.readFile(filePath);
          if (raw instanceof Uint8Array) {
            try {
              raw = new TextDecoder('utf-8', { fatal: true }).decode(raw);
            } catch (e) {
              throw new Error(`File '${filePath}' is binary and cannot be read as text.`);
            }
          }
          if (typeof raw !== 'string') {
            throw new Error(`File '${filePath}' could not be read as text.`);
          }
          if (raw.startsWith('cat: ') && raw.includes('No such file')) {
            throw new Error(`File '${filePath}' does not exist.`);
          }

          const allLines = raw.split('\n');
          const totalLines = allLines.length;
          const slice = allLines.slice(offset - 1, offset - 1 + limit);
          
          output = slice.map((line, idx) => {
            const lineNum = (offset + idx).toString().padStart(5, ' ');
            return `${lineNum} | ${line}`;
          }).join('\n');

          if (offset + limit <= totalLines) {
            output += `\n... [${totalLines - (offset - 1 + limit)} more lines. Use offset=${offset + limit} to continue]`;
          }

        } else if (tool === 'write') {
          const filePath = event.data.path || event.data.file || '';
          const rawContent = event.data.content;
          const content = rawContent ?? event.data.text ?? event.data.code ?? '';

          if (!filePath) throw new Error('Parameter "path" is required for write tool');
          if (typeof content !== 'string') {
            throw new Error('Parameter "content" must be a string for write tool');
          }
          if (content.length === 0 && event.data.allow_empty !== true && event.data.allowEmpty !== true) {
            throw new Error('Parameter "content" is empty — the tool block was not parsed correctly. File was NOT written.');
          }
          await opfs.writeFile(filePath, content);
          await flushVfsPersistence();
          const charCount = [...content].length;
          const byteCount = new TextEncoder().encode(content).length;
          output = `Successfully wrote ${charCount} characters (${byteCount} bytes) to '${filePath}'.`;

        } else if (tool === 'todowrite' || tool === 'todo') {
          const rawTodos = event.data.todos || [];
          const todos = Array.isArray(rawTodos) ? rawTodos : [];
          // Save active todos in OPFS / localStorage memory
          const completedCount = todos.filter(t => t.status === 'completed').length;
          const inProgressCount = todos.filter(t => t.status === 'in_progress').length;
          const pendingCount = todos.filter(t => t.status === 'pending' || !t.status).length;
          output = `Todos updated: ${completedCount}/${todos.length} completed` +
                   (inProgressCount ? `, ${inProgressCount} in progress` : '') +
                   (pendingCount ? `, ${pendingCount} pending` : '');

        } else if (tool === 'edit') {
          const filePath = event.data.path || event.data.file || '';
          const oldStr = event.data.old_str ?? event.data.oldStr ?? '';
          const newStr = event.data.new_str ?? event.data.newStr ?? '';

          if (!filePath) throw new Error('Parameter "path" is required for edit tool');
          if (typeof oldStr !== 'string' || typeof newStr !== 'string') {
            throw new Error('Parameters "old_str" and "new_str" are required for edit tool');
          }
          const fileContent = await opfs.readFile(filePath);
          const fileMissing = typeof fileContent !== 'string' ||
            (fileContent.startsWith('cat: ') && fileContent.includes('No such file'));

          if (fileMissing) {
            if (oldStr) {
              throw new Error(`File '${filePath}' does not exist. Use "write" to create new files.`);
            }
            // New file creation via edit with an empty old_str
            await opfs.writeFile(filePath, newStr);
            output = `Successfully created and wrote ${newStr.length} bytes to ${filePath}`;
          } else if (!oldStr && !fileContent) {
            await opfs.writeFile(filePath, newStr);
            output = `Successfully created and wrote ${newStr.length} bytes to ${filePath}`;
          } else {
            const occurrences = fileContent.split(oldStr).length - 1;
            if (occurrences === 0) {
              throw new Error(`Target text (old_str) was not found in '${filePath}'. Please verify exact lines and whitespace.`);
            }
            if (occurrences > 1) {
              throw new Error(`Target text occurs ${occurrences} times in '${filePath}'. Please provide more surrounding lines to uniquely identify the section.`);
            }

            const updatedContent = fileContent.replace(oldStr, newStr);
            await opfs.writeFile(filePath, updatedContent);
            output = `Successfully edited '${filePath}': replaced 1 occurrence.`;
          }

        } else if (tool === 'install_skill' || tool === 'add_skill') {
          const name = event.data.name || event.data.skill_name || 'Custom Skill';
          const desc = event.data.desc || event.data.description || name;
          const prompt = event.data.prompt || event.data.instructions || event.data.code || '';
          const url = event.data.url || '';

          let finalPrompt = prompt;
          if (url && !prompt) {
            try {
              const res = await proxyFetch(url);
              finalPrompt = await res.text();
            } catch (e) {
              throw new Error(`Failed to fetch skill from ${url}: ${e.message}`);
            }
          }

          if (!finalPrompt) throw new Error('Skill requires instructions prompt or URL');

          // Send message to content script to register skill in permanent storage
          window.parent.postMessage({
            type: 'DU_REGISTER_SKILL',
            skill: {
              name,
              desc,
              prompt: finalPrompt
            }
          }, '*');

          output = `Skill '${name}' installed successfully! It is now permanently active.`;

        } else if (tool === 'python' || tool === 'py') {
          let pyLogs = [];
          try {
            const py = await initPyodide();
            // Mount files written before/while Pyodide was loading (including /skills)
            syncVfsToPyodide();
            py.setStdout({ batched: (s) => pyLogs.push(s) });
            const res = await py.runPythonAsync(code);
            // Import files created by the Python script back into the canonical VFS
            syncPyodideToVfs();
            output = pyLogs.join('\n');
            if (res !== undefined) output += (output ? '\n' : '') + String(res);

            // Detect any new packages loaded via micropip.install() or loadPackage()
            try {
              if (py.loadedPackages) {
                const loaded = Object.keys(py.loadedPackages).filter(k => k !== 'micropip' && k !== 'packaging');
                if (loaded.length > 0) {
                  window.parent.postMessage({
                    type: 'DU_PERSIST_PACKAGES',
                    packages: loaded
                  }, '*');
                }
              }
            } catch (e) {}

          } catch (pyErr) {
            try { syncPyodideToVfs(); } catch (ignored) {}
            throw new Error(`Python Error: ${pyErr ? (pyErr.message || String(pyErr)) : 'Runtime error'}`);
          }

        } else if (tool === 'js') {
          let logs = [];
          const customConsole = {
            log: (...a) => logs.push(a.map(x => typeof x === 'object' ? JSON.stringify(x, null, 2) : String(x)).join(' ')),
            error: (...a) => logs.push('[ERR] ' + a.join(' '))
          };

          let jsBody = code.trim();
          if (!jsBody.includes('return ') && !jsBody.includes('let ') && !jsBody.includes('const ') && !jsBody.includes(';') && !jsBody.includes('\n')) {
            jsBody = 'return (' + jsBody + ');';
          }

          // Wrap in async IIFE so top-level await (fetch, opfs) works automatically!
          const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
          const fn = new AsyncFunction('console', 'opfs', 'fetch', `
            let __res;
            try {
              __res = await (async function(){
                ${jsBody}
              })();
            } catch(e) {
              throw e;
            }
            return __res;
          `);

          const res = await fn(customConsole, opfs, proxyFetch);
          output = logs.join('\n');
          if (res !== undefined) output += (output ? '\n' : '') + String(res);
        } else {
          throw new Error(`Unknown tool: "${tool}". Supported tools: write, edit, read, glob, grep, bash, python, js, question, todowrite, install_skill.`);
        }

        const origin = (event.origin && event.origin !== 'null') ? event.origin : '*';
        event.source.postMessage({
          id,
          success: true,
          output: output || '(no output)',
          executionTime: `${(performance.now() - startTime).toFixed(2)}ms`
        }, origin);

      } catch (err) {
        const origin = (event.origin && event.origin !== 'null') ? event.origin : '*';
        event.source.postMessage({
          id,
          success: false,
          output: `Error: ${err.message}`,
          executionTime: `${(performance.now() - startTime).toFixed(2)}ms`
        }, origin);
      }
    });

    // Ask the host page to restore the durable VFS before any tool runs.
    requestVfsBoot();
  </script>
</body>
