<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DeepUpgrade Desktop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #101114;
      --card: #1b1c21;
      --text: #e9eaee;
      --muted: #8b909a;
      --accent: #4d6bfe;
      --chip: #26272e;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 14px 14px 16px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 2px 0 14px;
      -webkit-app-region: drag;
    }

    h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .window-close {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .window-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 10px;
      -webkit-app-region: no-drag;
    }

    .card:last-of-type { margin-bottom: 0; }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 24px;
      margin-bottom: 12px;
    }

    .row:last-child { margin-bottom: 0; }

    .label {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.3;
    }

    /* ---------- switch ---------- */
    .toggle {
      position: relative;
      display: inline-block;
      flex: 0 0 auto;
      width: 44px;
      height: 26px;
    }

    .toggle input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #3a3d45;
      border-radius: 26px;
      transition: background 0.18s ease;
      pointer-events: none;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.18s ease;
    }

    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(18px); }
    .toggle input:focus-visible + .slider {
      outline: 2px solid rgba(77, 107, 254, 0.7);
      outline-offset: 2px;
    }

    /* ---------- select ---------- */
    .select {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
    }

    .select::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .select.full {
      display: flex;
      width: 100%;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--chip);
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 34px 9px 12px;
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }

    .select.full select { width: 100%; }

    select:hover { background: #2c2d35; }
    select:focus-visible { box-shadow: 0 0 0 2px rgba(77, 107, 254, 0.6); }

    /* ---------- launch button ---------- */
    .btn-launch {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: background 0.15s ease;
      -webkit-app-region: no-drag;
    }

    .btn-launch:hover {
      background: #5b76fe;
    }

    .btn-launch:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <header>
    <h1>DeepUpgrade Setup</h1>
    <button class="window-close" id="btnClose" title="Закрыть">✕</button>
  </header>

  <section class="card">
    <div class="card-title">Системный терминал</div>
    <span class="select full">
      <select id="shellSelect" aria-label="Терминал">
        <option value="" disabled selected>Поиск терминалов...</option>
      </select>
    </span>
  </section>

  <section class="card">
    <div class="card-title">Разрешения агента</div>
    <div class="row">
      <span class="label">Выполнение команд</span>
      <label class="toggle">
        <input type="checkbox" id="permExec" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="row">
      <span class="label">Доступ к файлам (FS)</span>
      <label class="toggle">
        <input type="checkbox" id="permFs" checked>
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <section class="card">
    <div class="card-title">Оформление</div>
    <span class="select full">
      <select id="themeSelect" aria-label="Тема оформления">
        <option value="default">Default Dark</option>
        <option value="oled">Pure OLED Black</option>
        <option value="cyberpunk">Cyberpunk Neon</option>
        <option value="glass">Liquid Glass</option>
      </select>
    </span>
  </section>

  <button class="btn-launch" id="btnLaunch">
    <span>Запустить DeepSeek</span>
  </button>

  <script src="setup.js"></script>
</body>
</html>
